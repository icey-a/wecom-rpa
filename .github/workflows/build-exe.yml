name: 打包 Windows exe




on:
  workflow_dispatch:




jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4




      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"




      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller




      - name: 打包主程序 wecom-rpa.exe
        run: pyinstaller --onefile --name wecom-rpa --collect-all paddleocr --collect-all paddle --collect-all pyclipper --hidden-import paddleocr.ppocr.postprocess --hidden-import paddleocr.ppocr.utils.utility --hidden-import paddleocr.ppocr.utils.network --hidden-import paddleocr.ppocr.utils.logging --hidden-import paddleocr.ppocr.utils.visual --hidden-import paddleocr.ppocr.data --hidden-import paddleocr.tools.infer.predict_system --hidden-import paddleocr.ppstructure.predict_system --collect-submodules skimage --collect-submodules scipy rpa_demo.py




      - name: 打包量坐标工具 wecom-calibrate.exe
        run: pyinstaller --onefile --name wecom-calibrate calibrate.py




      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: wecom-rpa-exe
          path: dist/*.exe




  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: 下载打包产物
        uses: actions/download-artifact@v4
        with:
          name: wecom-rpa-exe




      - name: 启动 wecom-rpa.exe 冒烟测试
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\wecom-rpa.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            Write-Error "wecom-rpa.exe 在 20 秒内退出，启动崩溃"
            exit 1
          }
          Write-Host "冒烟测试通过：wecom-rpa.exe 启动 20 秒后仍在运行（PID: $($proc.Id)）"
          Stop-Process -Id $proc.Id -Force
