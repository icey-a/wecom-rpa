name: 打包 Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包主程序 wecom-rpa.exe
        run: pyinstaller --onefile --name wecom-rpa --collect-all paddleocr --collect-all paddle rpa_demo.py

      - name: 打包量坐标工具 wecom-calibrate.exe
        run: pyinstaller --onefile --name wecom-calibrate calibrate.py

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: wecom-rpa-exe
          path: dist/*.exe
